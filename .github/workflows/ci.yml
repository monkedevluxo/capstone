# SentinelAI · Integración continua
#
# Corre en cada PR hacia main. Verifica tres cosas:
#   1. Los tests pasan (parser de ZAP y contrato del esquema)
#   2. Las migraciones aplican, revierten y están sincronizadas con los modelos
#   3. La base hace cumplir las reglas del proyecto (objetivos solo del
#      laboratorio, enriquecimientos consistentes, sin duplicados)
#
# No hay CD: el sistema es deliberadamente local, no hay dónde desplegar.
# Tampoco corren acá los escaneos de ZAP ni Ollama: uno es lento y el otro
# necesita GPU. Eso sigue siendo manual.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Si llega un commit nuevo al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el CI solo necesita leer el código.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests del parser y del esquema
        run: python -m pytest tests/ -v

  migraciones:
    name: Migraciones y restricciones
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_local   # base desechable del CI, no es un secreto
          POSTGRES_DB: sentinelai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel_local@localhost:5432/sentinelai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Aplicar migraciones
        run: alembic upgrade head

      # Falla si alguien cambió un modelo sin generar la migración.
      - name: Modelos y migraciones sincronizados
        run: alembic check

      - name: Cargar datos de prueba
        run: python scripts/seed.py

      # Intenta insertar lo que la base debe rechazar. Si lo acepta,
      # alguien debilitó una restricción.
      - name: Verificar restricciones del proyecto
        run: python scripts/verificar_bd.py

      - name: Revertir y reaplicar migraciones
        run: |
          alembic downgrade base
          alembic upgrade head
